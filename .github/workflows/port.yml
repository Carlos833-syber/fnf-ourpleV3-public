name: Build Ourple V3 Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compilar Ourple V3 para Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Pegar código do repositório
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: ☕ Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 📱 Instalar Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            build-tools;34.0.0
            platforms;android-34
            ndk;26.3.11579782
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk

      - name: ⚡ Instalar Haxe 4.3.6
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.6'

      - name: 📦 Instalar dependências do projeto (hmm)
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_NDK_ROOT: ${{ runner.temp }}/android-sdk/ndk/26.3.11579782
        run: |
          haxelib --global install hmm
          haxelib --global run hmm setup
          hmm install
          haxelib run lime setup

      - name: 🔨 Compilar APK
        env:
          ANDROID_HOME: ${{ runner.temp }}/android-sdk
          ANDROID_NDK_ROOT: ${{ runner.temp }}/android-sdk/ndk/26.3.11579782
        run: |
          lime build android -release --no-verbose
          ls -lh export/android/bin/app-release.apk

      - name: 📤 Salvar APK como download
        uses: actions/upload-artifact@v4
        with:
          name: OurpleV3-Android-APK
          path: export/android/bin/app-release.apk
          retention-days: 30
