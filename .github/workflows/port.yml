name: Build Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.7"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK r21e
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"
          sdkmanager "ndk;21.4.7075529"

      - name: Set Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

      - name: Install Haxelib dependencies
        run: |
          haxelib setup /home/runner/haxelib
          haxelib install lime
          haxelib install hmm
          haxelib run hmm install

      - name: Fix hxcpp
        run: |
          haxelib remove hxcpp || true
          haxelib install hxcpp 4.3.2
          haxelib set hxcpp 4.3.2

      - name: Setup Lime Android
        run: |
          haxelib run lime setup android

      - name: Verify Android NDK
        run: |
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          test -f "$ANDROID_NDK_ROOT/source.properties"
          cat "$ANDROID_NDK_ROOT/source.properties"

      - name: Verify hxcpp
        run: |
          haxelib list | grep hxcpp

      - name: Build Android
        run: |
          haxelib run lime build android -release -D MODS_ALLOWED -D LUA_ALLOWED

      - name: Find APK
        run: |
          echo "APK files found:"
          find export -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vs-Ourple-Guy-V3-Android
          path: export/**/*.apk
          if-no-files-found: error
