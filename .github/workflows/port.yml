name: Build Ourple V3 Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Ourple V3 para Android
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      HXCPP_COMPILE_THREADS: '2'

    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0 ndk;21.4.7075529'

      - name: Instalar Haxe 4.3.6
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.6'

      - name: Instalar dependencias fixadas
        shell: bash
        run: |
          set -euo pipefail
          haxelib --global install hmm 3.1.0 --always
          haxelib --global run hmm install
          # Transitive installs can change the selected version; restore every pin.
          python3 - <<'PY'
          import json, subprocess
          for dependency in json.load(open('hmm.json'))['dependencies']:
              if dependency['type'] == 'haxelib':
                  subprocess.run(['haxelib', 'set', dependency['name'], dependency['version']], check=True)
          PY
          (cd .haxelib/hxcpp/git/tools/hxcpp && haxe compile.hxml)
          haxelib list > haxelib-list.log

      - name: Preparar arquivos e configurar Lime
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_android_assets.py
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_HOME/ndk/21.4.7075529"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Compilar APK ARM64
        shell: bash
        run: |
          set -euo pipefail
          haxelib run lime build android -release -arm64 2>&1 | tee build-release.log

      - name: Assinar APK para instalacao direta
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t apks < <(find export/release/android/bin -type f -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "Esperado exatamente um APK release; encontrados ${#apks[@]}."
            exit 1
          fi
          mkdir -p apk
          tools="$ANDROID_HOME/build-tools/34.0.0"
          "$tools/zipalign" -f -p 4 "${apks[0]}" "$RUNNER_TEMP/OurpleV3-aligned.apk"
          # A disposable test key allows sideloading. This is not a Play Store signing key.
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/ourple-test.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/ourple-test.keystore" \
            --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android \
            --out apk/OurpleV3-Android-arm64.apk "$RUNNER_TEMP/OurpleV3-aligned.apk"
          "$tools/apksigner" verify apk/OurpleV3-Android-arm64.apk
          "$tools/zipalign" -c -p 4 apk/OurpleV3-Android-arm64.apk

      - name: Salvar APK
        uses: actions/upload-artifact@v4
        with:
          name: OurpleV3-Android-arm64
          path: apk/OurpleV3-Android-arm64.apk
          if-no-files-found: error
          retention-days: 30

      - name: Salvar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OurpleV3-build-logs
          path: |
            build-release.log
            haxelib-list.log
          if-no-files-found: ignore
          retention-days: 14
