name: Build Android APK

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@v1
        with:
          haxe-version: "4.3.7"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-34"
          sdkmanager "build-tools;34.0.0"
          sdkmanager "ndk;21.4.7075529"

      - name: Set Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/21.4.7075529" >> "$GITHUB_ENV"

      - name: Setup Haxelib
        run: |
          haxelib setup /home/runner/haxelib

      - name: Install Lime
        run: |
          haxelib install lime
          haxelib set lime latest

      - name: Install HMM
        run: |
          haxelib install hmm

      - name: Install project dependencies
        run: |
          haxelib run hmm install

      - name: Fix hxcpp
        run: |
          haxelib remove hxcpp || true
          haxelib install hxcpp 4.3.2
          haxelib set hxcpp 4.3.2

      - name: Setup Lime Android
        run: |
          haxelib run lime setup android

      - name: Verify Haxe libraries
        run: |
          echo "===== HAXELIB ====="
          haxelib list
          echo "==================="

      - name: Verify Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK=$ANDROID_SDK"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          echo "===== NDK ====="
          test -f "$ANDROID_NDK_ROOT/source.properties"
          cat "$ANDROID_NDK_ROOT/source.properties"

          echo "===== SDK ====="
          sdkmanager --list_installed | grep -E "platforms;android-34|build-tools;34.0.0|ndk;21.4.7075529" || true

      - name: Build Android APK
        run: |
          haxelib run lime build android -release -D MODS_ALLOWED -D LUA_ALLOWED

      - name: Find APK
        run: |
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Check APK
        run: |
          APK=$(find . -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERRO: nenhum APK foi encontrado."
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          echo "Tamanho:"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Vs-Ourple-Guy-V3-Android
          path: |
            export/**/*.apk
            export/**/*.apk
