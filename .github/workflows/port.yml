name: Build Ourple V3 Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar Ourple V3 para Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Pegar codigo do repositorio
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Definir variaveis do Android
        run: |
          echo "ANDROID_HOME=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$RUNNER_TEMP/android-sdk" >> "$GITHUB_ENV"

      - name: Instalar JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Android SDK basico
        uses: android-actions/setup-android@v3
        with:
          packages: >-
            build-tools;34.0.0
            platforms;android-34

      - name: Instalar NDK r21e
        run: |
          NDK_DIR="$ANDROID_HOME/ndk/21.4.7075529"
          mkdir -p "$NDK_DIR"
          wget -q https://dl.google.com/android/repository/android-ndk-r21e-linux-x86_64.zip -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /tmp
          mv /tmp/android-ndk-r21e/* "$NDK_DIR/"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "NDK instalado em: $NDK_DIR"

      - name: Instalar Haxe 4.3.6
        uses: krdlab/setup-haxe@v2
        with:
          haxe-version: '4.3.6'

      - name: Instalar dependencias (hmm)
        run: |
          haxelib --global install hmm
          haxelib --global run hmm setup
          hmm install
          haxelib list | grep -q '^lime:' || haxelib install lime
          haxelib run lime setup
          haxelib list | tee haxelib-list.log

      - name: Configurar Lime para Android
        run: |
          haxelib run lime config ANDROID_SDK "$ANDROID_HOME"
          haxelib run lime config ANDROID_NDK_ROOT "$ANDROID_NDK_ROOT"
          haxelib run lime config JAVA_HOME "$JAVA_HOME"
          haxelib run lime config ANDROID_SETUP true

      - name: Compilar APK debug
        run: |
          set -o pipefail
          haxelib run lime build android -debug --no-verbose 2>&1 | tee build-debug.log

      - name: Compilar APK release
        run: |
          set -o pipefail
          haxelib run lime build android -release --no-verbose 2>&1 | tee build-release.log

      - name: Listar APKs gerados
        if: always()
        run: find export -name '*.apk' -exec ls -lh {} \; || true

      - name: Salvar APKs
        uses: actions/upload-artifact@v4
        with:
          name: OurpleV3-Android-APKs
          path: export/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Salvar logs do build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OurpleV3-build-logs
          path: |
            build-debug.log
            build-release.log
            haxelib-list.log
          if-no-files-found: ignore
          retention-days: 14
